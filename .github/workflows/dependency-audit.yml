name: Dependency audit

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerable-packages:
    name: Resolved NuGet vulnerability audit
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Fail on High or Critical resolved package vulnerabilities
        shell: pwsh
        run: ./tools/check-vulnerable-packages.ps1 -MinimumSeverity High
