name: Publish To Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag in this repository"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The GML checker is native, so it builds on a runner matching its target
  # rather than riding the .NET publish's cross-compile. Only momi-gml-check is
  # built and uploaded here: momi-gml-probe executes GML and never ships.
  checker:

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: win-x86
            os: windows-latest
            target: i686-pc-windows-msvc
          - arch: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build momi-gml-check
        run: cargo build --release --manifest-path tools/checker/Cargo.toml --target ${{ matrix.target }} --bin momi-gml-check
      - name: Upload the ${{ matrix.arch }} checker
        uses: actions/upload-artifact@v7
        with:
          name: checker-${{ matrix.arch }}
          path: tools/checker/target/${{ matrix.target }}/release/momi-gml-check*
          if-no-files-found: error

  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag and built version agree
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          EXPECTED_TAG="v$APP_VERSION"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match Directory.Build.props version $APP_VERSION (expected $EXPECTED_TAG)."
            exit 1
          fi
          echo "Release tag and built version agree: $RELEASE_TAG"

  compile:
    needs: [checker, validate-release]

    strategy:
      fail-fast: false
      matrix:
        project: [ModsOfMistriaCommandLine, ModsOfMistriaGUI]
        arch: [linux-x64, win-x64, win-x86, osx-x64]
        os: [windows]
        configuration: [Release]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure ImageSharp license
        shell: bash
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "::error::SIXLABORS_LICENSE secret is required for ImageSharp 4.x builds."
            exit 1
          fi
          printf '%s' "$SIXLABORS_LICENSE" > ModsOfMistriaInstallerLib/sixlabors.lic
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download the ${{ matrix.arch }} checker
        uses: actions/download-artifact@v8
        with:
          name: checker-${{ matrix.arch }}
          path: tools/checker/dist/${{ matrix.arch }}
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build
      - name: Test
        run: dotnet test
      - name: Publish ${{ matrix.project }} ${{ matrix.arch }}
        run: dotnet publish ${{ matrix.project }} -c ${{ matrix.configuration }} -r ${{ matrix.arch }} -o Release
      # Matrix jobs run concurrently. Keep their outputs separate here; a
      # single job below publishes them so duplicate release metadata can
      # never race through `gh release upload --clobber`.
      - name: Store ${{ matrix.project }} ${{ matrix.arch }} release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.project }}-${{ matrix.arch }}
          path: Release/*
          if-no-files-found: error

  publish-release:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Collect compiled release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false
      - name: Upload release files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir Release

          mapfile -t asset_paths < <(find release-artifacts -type f -printf '%p\n' | sort)
          if [ "${#asset_paths[@]}" -eq 0 ]; then
            echo "::error::No compiled release files were downloaded."
            exit 1
          fi

          mapfile -t duplicate_names < <(printf '%s\n' "${asset_paths[@]##*/}" | sort | uniq -d)
          if [ "${#duplicate_names[@]}" -ne 0 ]; then
            printf '::error::Duplicate release asset names detected:\n%s\n' "${duplicate_names[*]}"
            exit 1
          fi

          for asset_path in "${asset_paths[@]}"; do
            cp "$asset_path" "Release/${asset_path##*/}"
          done

          ls -l Release
          gh release upload "$RELEASE_TAG" Release/* \
            --repo "${{ github.repository }}" \
            --clobber
