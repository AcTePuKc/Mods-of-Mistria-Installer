name: Upload To Nexus

on:
  workflow_dispatch:
    inputs:
      upload_to_nexus:
        description: "Upload to Nexus only when explicitly enabled"
        required: true
        default: false
        type: boolean
      upload_windows:
        description: "Upload the Windows package"
        required: false
        default: true
        type: boolean
      upload_linux:
        description: "Upload the Linux / SteamOS package"
        required: false
        default: true
        type: boolean
      upload_macos:
        description: "Upload the macOS package"
        required: false
        default: true
        type: boolean

# Nexus upload is opt-in twice: the manual input must be true and the
# repository variable NEXUS_UPLOAD_ENABLED must be set to the string "true".
# Windows, Linux/SteamOS and macOS portable packages upload to their existing
# Nexus files through the corresponding NEXUS_FILE_ID_* secrets. Each upload
# archives the previous version of that platform file, updates the mod's
# displayed version, and adds the checked-in Nexus changelog to the new file
# version.

jobs:
  # This workflow is its own run, so it cannot reach compile.yml's artifacts:
  # it builds the checkers it needs. Three arches, since the publish steps
  # below cover Windows, Linux and OSX from the one job. Only momi-gml-check
  # is built: momi-gml-probe executes GML and never ships.
  checker:

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: osx-x64
            os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build momi-gml-check
        run: cargo build --release --manifest-path tools/checker/Cargo.toml --target ${{ matrix.target }} --bin momi-gml-check
      - name: Upload the ${{ matrix.arch }} checker
        uses: actions/upload-artifact@v7
        with:
          name: checker-${{ matrix.arch }}
          path: tools/checker/target/${{ matrix.target }}/release/momi-gml-check*
          if-no-files-found: error

  nexus_package:
    needs: checker

    strategy:
      fail-fast: false
      matrix:
        project: [ModsOfMistriaGUI]
        arch: [win-x64]
        os: [ubuntu-latest]
        configuration: [Release]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Configure ImageSharp license
        shell: bash
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "::error::SIXLABORS_LICENSE secret is required for ImageSharp 4.x builds."
            exit 1
          fi
          printf '%s' "$SIXLABORS_LICENSE" > ModsOfMistriaInstallerLib/sixlabors.lic
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download the checkers
        uses: actions/download-artifact@v8
        with:
          pattern: checker-*
          path: tools/checker/staged
      - name: Lay the checkers out per RID
        run: |
          for arch in win-x64 linux-x64 osx-x64; do
            mkdir -p tools/checker/dist/$arch
            cp tools/checker/staged/checker-$arch/momi-gml-check* tools/checker/dist/$arch/
          done
          ls -lR tools/checker/dist

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build
      - name: Test
        run: dotnet test

      - name: Get Assembly Version
        run: |
          VERSION=$(dotnet msbuild -nologo -verbosity:quiet -getProperty:AssemblyVersion ModsOfMistriaGUI)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Load Nexus changelog
        shell: bash
        run: |
          {
            echo 'NEXUS_CHANGELOG<<AIM_NEXUS_CHANGELOG'
            cat docs/NEXUS_CHANGELOG.txt
            echo 'AIM_NEXUS_CHANGELOG'
          } >> "$GITHUB_ENV"

      - name: Resolve Nexus API mod ID
        shell: bash
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_MOD_PAGE_ID: "949"
        run: |
          if [ -z "$NEXUS_API_KEY" ]; then
            echo "::error::NEXUS_API_KEY secret is required to resolve the AIM Nexus mod ID."
            exit 1
          fi

          NEXUS_MOD_ID=$(curl --fail --silent --show-error --retry 3 \
            -H "apikey: $NEXUS_API_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Nexus-Mods/upload-action" \
            -H "accept: application/json" \
            "https://api.nexusmods.com/v3/games/fieldsofmistria/mods/$NEXUS_MOD_PAGE_ID" \
            | jq -r '.data.id // empty')

          if ! [[ "$NEXUS_MOD_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Nexus API did not return a numeric mod ID for AIM page $NEXUS_MOD_PAGE_ID."
            exit 1
          fi

          echo "NEXUS_MOD_ID=$NEXUS_MOD_ID" >> "$GITHUB_ENV"
        
      - name: Compile Windows package
        run: dotnet publish ModsOfMistriaGUI -c Release -r win-x64 -p:AimDistribution=Nexus -p:PublishSingleFile=true -p:SelfContained=true -p:PublishReadyToRun=true -p:IncludeAllContentForSelfExtract=true -o Release/windows
      - name: Zip Windows package
        run: (cd Release/windows && zip -r "../AIM-${{ env.APP_VERSION }}-windows.zip" .)

      - name: Compile Linux package
        run: dotnet publish ModsOfMistriaGUI -c Release -r linux-x64 -p:AimDistribution=Nexus -p:PublishSingleFile=true -p:SelfContained=true -p:PublishReadyToRun=true -p:IncludeAllContentForSelfExtract=true -o Release/linux
      - name: Zip Linux package
        run: (cd Release/linux && zip -r "../AIM-${{ env.APP_VERSION }}-linux.zip" .)

      - name: Compile macOS package
        run: dotnet publish ModsOfMistriaGUI -c Release -r osx-x64 -p:AimDistribution=Nexus -p:PublishSingleFile=true -p:SelfContained=true -p:PublishReadyToRun=true -p:IncludeAllContentForSelfExtract=true -o Release/macos
      - name: Zip macOS package
        run: (cd Release/macos && zip -r "../AIM-${{ env.APP_VERSION }}-macos.zip" .)

      - name: Upload test artifacts to GitHub Actions only
        uses: actions/upload-artifact@v7
        with:
          name: nexus-test-package-${{ env.APP_VERSION }}
          path: Release/AIM-*.zip
          if-no-files-found: error

      # Nexus upload is deliberately disabled unless both switches are enabled.
      # Keep NEXUS_UPLOAD_ENABLED unset/false while a release is under review.
      - name: Upload Windows package to Nexus
        if: ${{ inputs.upload_to_nexus == true && inputs.upload_windows == true && vars.NEXUS_UPLOAD_ENABLED == 'true' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ secrets.NEXUS_FILE_ID_WINDOWS }}
          filename: Release/AIM-${{ env.APP_VERSION }}-windows.zip
          version: ${{ env.APP_VERSION }}
          display_name: "AIM Windows"
          description: "Self-contained AIM package for Windows."
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ env.NEXUS_CHANGELOG }}
          archive_existing_version: true
          update_mod_version: true

      - name: Upload Linux / SteamOS package to Nexus
        if: ${{ inputs.upload_to_nexus == true && inputs.upload_linux == true && vars.NEXUS_UPLOAD_ENABLED == 'true' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ secrets.NEXUS_FILE_ID_LINUX }}
          filename: Release/AIM-${{ env.APP_VERSION }}-linux.zip
          version: ${{ env.APP_VERSION }}
          display_name: "AIM Linux and SteamOS"
          description: "Self-contained AIM package for Linux and SteamOS."
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ env.NEXUS_CHANGELOG }}
          archive_existing_version: true
          update_mod_version: true

      - name: Upload macOS package to Nexus
        if: ${{ inputs.upload_to_nexus == true && inputs.upload_macos == true && vars.NEXUS_UPLOAD_ENABLED == 'true' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ secrets.NEXUS_FILE_ID_MACOS }}
          filename: Release/AIM-${{ env.APP_VERSION }}-macos.zip
          version: ${{ env.APP_VERSION }}
          display_name: "AIM macOS"
          description: "Self-contained AIM package for macOS."
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ env.NEXUS_CHANGELOG }}
          archive_existing_version: true
          update_mod_version: true
